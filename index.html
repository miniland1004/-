<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Mini Land - Promotion</title>
    <style>
        /* 기존 스타일 전체 유지 */
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .logo { margin-bottom: 30px; }
        
        .container { display: flex; gap: 20px; align-items: flex-start; }
        .card { background: white; border-radius: 15px; padding: 20px; width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* 1. 일반 홍보: 초록색 폰트 -> 빨간색으로 수정 */
        .general-header { color: #ff6b6b; font-size: 1.2em; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }
        .general-label { color: #ff6b6b; font-weight: bold; display: block; margin: 15px 0 5px; } /* 수정된 부분 */
        
        /* 2. 특별 홍보: 파란색 테마로 추가 */
        .special-header { color: #4dabf7; font-size: 1.2em; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }
        .special-label { color: #4dabf7; font-weight: bold; display: block; margin: 15px 0 5px; }
        
        /* 입력창 및 버튼 기존 스타일 유지 */
        input { width: 100%; padding: 10px; border: 1px solid #dee2e6; border-radius: 8px; box-sizing: border-box; margin-bottom: 5px; background-color: #f8f9fa; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 20px; }
        .btn-red { background-color: #ff6b6b; }
        .btn-blue { background-color: #4dabf7; }

        .info-box { background: #f1f3f5; padding: 15px; border-radius: 10px; margin-top: 20px; font-size: 13px; color: #495057; line-height: 1.5; }
    </style>
</head>
<body>

    <!-- 기존 로고 (123.png) 그대로 유지 -->
    <div class="logo">
        <img src="123.png" alt="미니랜드 로고"> 
    </div>

    <div class="container">
        <!-- [일반 홍보 인증] 초록색 부분만 빨간색으로 변경 -->
        <div class="card">
            <div class="general-header">📄 일반 홍보 인증</div>
            
            <label class="general-label">캐릭터 닉네임</label>
            <input type="text" placeholder="닉네임을 입력하세요.">
            
            <label class="general-label">홍보 누적 횟수 (필수)</label>
            <input type="text" placeholder="현재까지의 누적 횟수를 입력하세요.">
            
            <label class="general-label">일반 홍보 링크 (10개 필수)</label>
            <input type="text" placeholder="1번 링크">
            <input type="text" placeholder="2번 링크">
            <input type="text" placeholder="3번 링크">
            <input type="text" placeholder="4번 링크">
            <input type="text" placeholder="5번 링크">
            <input type="text" placeholder="6번 링크">
            <input type="text" placeholder="7번 링크">
            <input type="text" placeholder="8번 링크">
            <input type="text" placeholder="9번 링크">
            <input type="text" placeholder="10번 링크">
            
            <button class="btn btn-red">일반 홍보 인증 제출</button>
        </div>

        <!-- [특별 홍보 인증] 파란색 테마로 신규 추가 -->
        <div class="card">
            <div class="special-header">⭐ 특별 홍보 인증</div>
            
            <label class="special-label">캐릭터 닉네임</label>
            <input type="text" placeholder="닉네임을 입력하세요.">
            
            <label class="special-label">특별 홍보 링크 (최대 5개)</label>
            <input type="text" placeholder="특별 1번 링크">
            <input type="text" placeholder="특별 2번 링크">
            <input type="text" placeholder="특별 3번 링크">
            <input type="text" placeholder="특별 4번 링크">
            <input type="text" placeholder="특별 5번 링크">
            
            <div class="info-box">
                <strong>📢 특별 홍보 엄중 안내</strong>
                • 지정 플랫폼 엄수: 지정 사이트 및 규정 양식을 반드시 준수하시기 바랍니다.<br>
                • 철저한 검증: 운영진의 전수 조사 후 조건 충족 시 지급됩니다.
            </div>
            
            <button class="btn btn-blue">특별 홍보 인증 제출</button>
        </div>
    </div>

</body>
</html>
