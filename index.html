<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .container { display: flex; gap: 25px; }
        .card { background: white; border-radius: 20px; padding: 25px; width: 420px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        
        /* 일반 홍보 - RED 테마 */
        .general { border-top: 12px solid #ff6b6b; }
        .general h2 { color: #ff6b6b; margin-top: 0; display: flex; align-items: center; gap: 8px; }
        .general .label-text { color: #ff6b6b; font-weight: bold; display: block; margin: 15px 0 8px; font-size: 15px; }
        .btn-red { background-color: #ff6b6b; }

        /* 특별 홍보 - BLUE 테마 */
        .special { border-top: 12px solid #4dabf7; }
        .special h2 { color: #4dabf7; margin-top: 0; display: flex; align-items: center; gap: 8px; }
        .special .label-text { color: #4dabf7; font-weight: bold; display: block; margin: 15px 0 8px; font-size: 15px; }
        .btn-blue { background-color: #4dabf7; }

        input { width: 100%; padding: 12px; border: 1px solid #e9ecef; border-radius: 10px; box-sizing: border-box; margin-bottom: 8px; background-color: #f8f9fa; transition: 0.2s; }
        input:focus { border-color: #adb5bd; outline: none; background-color: #fff; }
        
        .btn { width: 100%; padding: 18px; border: none; border-radius: 12px; color: white; font-weight: bold; font-size: 17px; cursor: pointer; margin-top: 25px; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }

        .info-box { background: #f1f3f5; padding: 18px; border-radius: 12px; margin-top: 25px; font-size: 14px; line-height: 1.6; color: #495057; }
        .info-box strong { display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 일반 홍보 인증 -->
        <div class="card general">
            <h2>📄 일반 홍보 인증</h2>
            
            <span class="label-text">캐릭터 닉네임</span>
            <input type="text" placeholder="닉네임을 입력하세요.">
            
            <span class="label-text">홍보 누적 횟수 (필수)</span>
            <input type="text" placeholder="현재까지의 누적 횟수를 입력하세요.">
            
            <span class="label-text">일반 홍보 링크 (10개 필수)</span>
            <input type="text" placeholder="1번 링크">
            <input type="text" placeholder="2번 링크">
            <input type="text" placeholder="3번 링크">
            <input type="text" placeholder="4번 링크">
            <input type="text" placeholder="5번 링크">
            <input type="text" placeholder="6번 링크">
            <input type="text" placeholder="7번 링크">
            <input type="text" placeholder="8번 링크">
            <input type="text" placeholder="9번 링크">
            <input type="text" placeholder="10번 링크">
            
            <button class="btn btn-red">일반 홍보 인증 제출</button>
        </div>

        <!-- 특별 홍보 인증 -->
        <div class="card special">
            <h2>⭐ 특별 홍보 인증</h2>
            
            <span class="label-text">캐릭터 닉네임</span>
            <input type="text" placeholder="닉네임을 입력하세요.">
            
            <span class="label-text">특별 홍보 링크 (최대 5개)</span>
            <input type="text" placeholder="특별 1번 링크">
            <input type="text" placeholder="특별 2번 링크">
            <input type="text" placeholder="특별 3번 링크">
            <input type="text" placeholder="특별 4번 링크">
            <input type="text" placeholder="특별 5번 링크">
            
            <div class="info-box">
                <strong>📢 특별 홍보 엄중 안내</strong>
                • 지정 플랫폼 엄수: 지정 사이트 및 규정 양식을 반드시 준수하시기 바랍니다.<br>
                • 철저한 검증: 운영진의 전수 조사 후 조건 충족 시 지급됩니다.
            </div>
            
            <button class="btn btn-blue">특별 홍보 인증 제출</button>
        </div>
    </div>

</body>
</html>
